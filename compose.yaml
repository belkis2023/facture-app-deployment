
services:
  postgres:
    image: postgres:16
    container_name: facture-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: facturedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - facture_data:/var/lib/postgresql/data

volumes:
  facture_data:
    external: true
    name: f035dd14fda2b576aa2bad4851476c1e563ffbe706719c2eccad3ae7e716ca10
